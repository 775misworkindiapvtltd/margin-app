<style>
:root{
  --sidebar:#0C1017;--sidebar-hover:#151B24;--sidebar-active:#1A2130;--sidebar-line:#1E2531;
  --bg:#F2F1ED;--surface:#FFFFFF;--ink:#1A1712;--ink-secondary:#48443D;--muted:#8A8479;
  --line:#E2DED6;--line-light:#EEECE6;--accent:#B4862B;--accent-dark:#8C6720;--accent-tint:#F6ECD6;--accent-tint2:#FDF8EE;
  --danger:#C4291C;--danger-tint:#FBEAE9;--success:#2E7D46;--success-tint:#E5F5EA;
  --recv:#2563EB;--recv-tint:#EFF6FF;--pay:#B4862B;--pay-tint:#F6ECD6;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;transition:background .3s,color .3s;overflow:hidden;}
html.dark{
  --bg:#0C1017;--surface:#151B24;--ink:#E8E0D0;--ink-secondary:#A8A297;--muted:#6B6560;
  --line:#2A2F38;--line-light:#1E2531;--accent:#C6952F;--accent-dark:#E8B84A;--accent-tint:#2A2518;--accent-tint2:#1A1710;
  --danger:#EF5350;--danger-tint:#2A1515;--success:#4CAF50;--success-tint:#152A18;
  --recv:#60A5FA;--recv-tint:#1A2540;--pay:#C6952F;--pay-tint:#2A2518;
}
html.dark .login-wrap{background:linear-gradient(145deg,#050810 0%,#0C1017 50%,#151B24 100%);}
html.dark .login-card{background:var(--surface);box-shadow:0 40px 80px -30px rgba(0,0,0,.8);}
html.dark .field input{background:#0C1017;border-color:var(--line);color:var(--ink);}
html.dark .field input:focus{background:#0A0E14;border-color:var(--accent);}
html.dark .topbar{background:var(--surface);border-color:var(--line);}
html.dark .content{background:var(--bg);}
html.dark .sidebar{border-color:var(--line);}
html.dark .card{background:var(--surface);border-color:var(--line);}
html.dark .dt-table-wrap,html.dark .rpt-table-wrap,html.dark .ledger-wrap{background:var(--surface);border-color:var(--line);}
html.dark table.dt tbody td,html.dark table.ledger-table tbody td{border-color:var(--line-light);color:var(--ink);}
html.dark table.dt tbody tr:nth-child(even),html.dark table.ledger-table tbody tr:nth-child(even){background:#0F141B;}
html.dark table.dt tbody tr:hover{background:var(--accent-tint);}
html.dark .dt-pagination{background:var(--surface);border-color:var(--line);color:var(--ink-secondary);}
html.dark .dt-pagination select{background:#1A1F28;border-color:#2A2F38;color:var(--ink);}
html.dark .dt-pagination .nav button{background:#1A1F28;border-color:#2A2F38;color:var(--ink-secondary);}
html.dark .btn-ghost{border-color:var(--line);color:var(--ink-secondary);}
html.dark .btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);}
html.dark .topbar-controls{background:var(--surface);border-color:var(--line);}
html.dark .topbar-controls button{color:var(--ink-secondary);}
html.dark .modal-card{background:var(--surface);}
html.dark .ledger-header,html.dark .ledger-party-list{background:var(--surface);border-color:var(--line);}
html.dark .party-row:hover{background:var(--accent-tint);}
html.dark .party-row.active{background:var(--accent-tint);}
html.dark .bottom-nav{background:var(--sidebar);border-color:var(--sidebar-line);}

#app{height:100vh;}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
input,select,button{font-family:inherit;font-size:13px;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#CCC8BE;border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}

.loading-screen{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);background:var(--bg);}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- LOGIN ---------- */
.login-wrap{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0C1017 0%,#151B24 50%,#1A2130 100%);padding:20px;overflow-y:auto;}
.login-card{width:400px;max-width:100%;background:var(--surface);border-radius:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);overflow:hidden;}
.login-top{background:linear-gradient(135deg,#0C1017,#1A2130);color:#EDE6D6;padding:32px 34px 26px;border-bottom:3px solid var(--accent);}
.login-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;}
.login-top h1{font-size:22px;margin:8px 0 0;font-weight:600;letter-spacing:-.01em;color:#fff;}
.login-body{padding:30px 34px 34px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;}
.field input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;background:#FAFAF7;color:var(--ink);transition:border .15s,box-shadow .15s;}
.field input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-tint);}
.btn{border:none;border-radius:8px;padding:11px 18px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;}
.btn:active{transform:scale(.98);}
.btn-gold{background:linear-gradient(135deg,#C69530,#A07520);color:#fff;box-shadow:0 2px 8px rgba(180,134,43,.3);}
.btn-gold:hover{box-shadow:0 4px 14px rgba(180,134,43,.4);filter:brightness(1.05);}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint2);}
.btn-block{width:100%;justify-content:center;}
.login-error{background:var(--danger-tint);color:var(--danger);font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-weight:500;}
.login-hint{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:14px;}
.login-hint b{color:var(--ink);}

/* ---------- SHELL / NAV ---------- */
.shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:216px;flex:none;background:var(--sidebar);color:#A8A297;display:flex;flex-direction:column;height:100vh;border-right:1px solid var(--sidebar-line);transition:transform .25s ease;}
.brand{padding:14px 14px 12px;border-bottom:1px solid var(--sidebar-line);display:flex;align-items:center;justify-content:space-between;}
.brand-inner{display:flex;flex-direction:column;}
.brand-icon{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#C6952F);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:12px;margin-bottom:8px;}
.brand .eyebrow{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.2em;color:#6B6560;text-transform:uppercase;}
.brand h1{font-size:13px;margin:2px 0 0;color:#F0EAD8;font-weight:600;letter-spacing:-.01em;}
.sidebar-close{display:none;border:none;background:transparent;color:#8E887D;font-size:18px;cursor:pointer;padding:4px 8px;}
.nav{flex:1;padding:8px 6px;overflow-y:auto;}
.nav-group-label{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#5A5F68;font-weight:700;padding:12px 10px 4px 12px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:6px;color:#B8B2A6;font-size:12.5px;font-weight:600;cursor:pointer;transition:background .12s,color .12s;}
.nav-item .n-ic{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center;opacity:.85;}
.nav-item:hover{background:var(--sidebar-hover);color:#E8E0D0;}
.nav-item.active{background:var(--sidebar-active);color:#F0EAD8;box-shadow:inset 3px 0 0 var(--accent);}
.nav-empty{font-size:10.5px;color:#5A5F68;padding:8px 10px;font-style:italic;}
.sidebar-foot{padding:10px 10px 14px;border-top:1px solid var(--sidebar-line);}
.logout-btn{font-size:11px;color:#8E887D;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;transition:all .12s;}
.logout-btn:hover{background:var(--sidebar-hover);color:#E8E0D0;}
.sidebar-overlay{display:none;}

.main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;height:44px;display:flex;align-items:center;justify-content:space-between;flex:none;}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
.hamburger{display:none;border:none;background:transparent;cursor:pointer;color:var(--ink-secondary);font-size:18px;padding:4px 6px;}
.topbar-left h2{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-controls{display:flex;align-items:center;gap:4px;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:2px 4px;}
.topbar-controls button{border:none;background:transparent;cursor:pointer;padding:3px 6px;border-radius:4px;font-size:12px;color:var(--ink-secondary);font-weight:700;transition:all .12s;line-height:1;}
.topbar-controls button:hover{background:var(--accent-tint);color:var(--accent-dark);}
.topbar-controls .divider{width:1px;height:14px;background:var(--line);margin:0 2px;}
.topbar-welcome{font-size:11px;color:var(--ink-secondary);font-weight:500;}
.topbar-welcome b{color:var(--ink);font-weight:600;}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#C6952F);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:11px;flex:none;}
.content{padding:12px 16px 16px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;}

.toast{position:fixed;top:16px;right:16px;z-index:100;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px;animation:toast-in .22s cubic-bezier(.2,.8,.4,1);background:var(--success-tint);color:var(--success);border:1px solid #BEE3C9;}
@keyframes toast-in{from{opacity:0;transform:translateY(-10px) scale(.96);}to{opacity:1;transform:none;}}
.toast.err{background:var(--danger-tint);color:var(--danger);border-color:#F3C6C3;}

/* ---------- DASHBOARD CARDS ---------- */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;transition:box-shadow .15s,transform .1s;}
.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-1px);}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;}
.card-icon.recv{background:var(--recv-tint);color:var(--recv);}
.card-icon.pay{background:var(--pay-tint);color:var(--pay);}
.card-icon.exp{background:var(--danger-tint);color:var(--danger);}
.card-icon.net{background:var(--success-tint);color:var(--success);}
.card-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;}
.card-value{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:var(--ink);}
.card-sub{font-size:10.5px;color:var(--muted);margin-top:4px;}
.card-sub.up{color:var(--danger);}
.card-sub.down{color:var(--success);}

.dash-row{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.panel-title{padding:12px 16px;border-bottom:1px solid var(--line-light);font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:space-between;}
.panel-title a{font-size:10.5px;font-weight:600;color:var(--accent-dark);text-decoration:none;cursor:pointer;}
.panel-body{padding:14px 16px;}

.mini-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-light);font-size:12px;}
.mini-row:last-child{border-bottom:0;}
.mini-row .nm{font-weight:600;color:var(--ink);}
.mini-row .sub{font-size:10.5px;color:var(--muted);}
.mini-row .amt{font-family:'JetBrains Mono',monospace;font-weight:700;}
.mini-row .amt.recv{color:var(--recv);}
.mini-row .amt.pay{color:var(--pay);}

.bar-chart{display:flex;flex-direction:column;gap:10px;}
.bar-item{display:flex;align-items:center;gap:10px;}
.bar-item .b-label{width:78px;font-size:10.5px;color:var(--muted);font-weight:600;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:14px;background:var(--line-light);border-radius:7px;overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent),#E0B458);}
.bar-fill.recv{background:linear-gradient(90deg,var(--recv),#7FA8F5);}
.bar-item .b-val{width:82px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:var(--ink);flex:none;}

.age-buckets{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.age-bucket{background:var(--accent-tint2);border:1px solid var(--line);border-radius:9px;padding:10px 8px;text-align:center;}
.age-bucket .ab-label{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.age-bucket .ab-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--ink);margin-top:4px;}
.age-bucket.danger{background:var(--danger-tint);}
.age-bucket.danger .ab-val{color:var(--danger);}

/* ---------- DATA GRID (generic engine) ---------- */
.dt-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex:none;flex-wrap:wrap;}
.dt-toolbar .count{font-size:12px;color:var(--muted);font-weight:500;}
.dt-colmenu-wrap{position:relative;margin-left:auto;}
.dt-colmenu{position:absolute;right:0;top:38px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.12);padding:12px;min-width:200px;z-index:20;}
.dt-colmenu .h{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;font-weight:700;margin-bottom:8px;}
.dt-colmenu label{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:5px 4px;cursor:pointer;border-radius:4px;}
.dt-colmenu label:hover{background:var(--accent-tint2);}
.dt-table-wrap{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.04);}
.dt-scroll{flex:1;overflow:auto;min-height:0;}
table.dt{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;}
table.dt thead th{position:sticky;top:0;background:#0F141B;color:#D6CFC0;z-index:4;padding:0;border-right:1px solid #1E2531;overflow:hidden;}
table.dt thead th .th-inner{padding:9px 12px;display:flex;flex-direction:column;gap:5px;position:relative;min-height:36px;}
table.dt thead th .th-row{display:flex;align-items:center;gap:6px;}
table.dt thead th .th-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
table.dt thead th .sort-ic{font-size:9px;color:var(--accent);width:10px;flex:none;}
table.dt thead th .search-ic{margin-left:auto;cursor:pointer;color:#6B7280;flex:none;font-size:11px;transition:color .15s;}
table.dt thead th .search-ic:hover{color:var(--accent);}
table.dt thead th .th-filter input{width:100%;padding:5px 8px;border-radius:5px;border:1px solid #2D3545;background:#0A0E14;color:#E8E0D0;font-size:11.5px;}
table.dt thead th .th-filter input::placeholder{color:#5A6070;}
table.dt thead th .resize-handle{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5;}
table.dt thead th .resize-handle:hover,table.dt thead th .resize-handle.active{background:rgba(180,134,43,.5);}
table.dt tbody td{padding:8px 12px;border-bottom:1px solid var(--line-light);border-right:1px solid #F2F0EA;font-size:12.5px;white-space:normal;word-break:break-word;vertical-align:top;overflow-wrap:anywhere;}
table.dt tbody tr:nth-child(even){background:#FAFAF7;}
table.dt tbody tr:hover{background:var(--accent-tint2);}
table.dt tbody td.num{font-family:'JetBrains Mono',monospace;text-align:right;}
.code-pill{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:var(--accent-dark);background:var(--accent-tint);border-radius:5px;padding:3px 8px;display:inline-block;}
.pill-danger{color:var(--danger);background:var(--danger-tint);}
.pill-success{color:var(--success);background:var(--success-tint);}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
.empty-state .big{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--ink-secondary);margin-bottom:6px;font-weight:600;}
.dt-pagination{display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex:none;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;font-size:12px;color:var(--muted);font-weight:500;}
.dt-pagination .pp{display:flex;align-items:center;gap:8px;}
.dt-pagination select{padding:5px 10px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;}
.dt-pagination .nav{display:flex;align-items:center;gap:4px;margin-left:auto;}
.dt-pagination .nav button{border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--ink-secondary);font-size:12px;transition:all .12s;}
.dt-pagination .nav button:disabled{opacity:.35;cursor:default;}
.dt-pagination .nav button:not(:disabled):hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint2);}
.dt-pagination .pageinfo{font-weight:600;color:var(--ink-secondary);white-space:nowrap;}

/* ---------- MOBILE CARD LIST (alt view of a grid on small screens) ---------- */
.mcard-list{display:none;flex-direction:column;gap:10px;}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.mcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.mcard-title{font-weight:700;font-size:13px;color:var(--ink);}
.mcard-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.mcard-amt{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;white-space:nowrap;}
.mcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:11px;}
.mcard-grid .k{color:var(--muted);}
.mcard-grid .v{color:var(--ink);font-weight:600;text-align:right;}

/* ---------- LEDGER ---------- */
.ledger-shell{display:flex;gap:14px;flex:1;min-height:0;}
.ledger-party-list{width:280px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
.ledger-search{padding:10px 12px;border-bottom:1px solid var(--line-light);flex:none;}
.ledger-search input{width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-size:12.5px;}
.party-scroll{flex:1;overflow-y:auto;}
.party-row{padding:10px 14px;border-bottom:1px solid var(--line-light);cursor:pointer;transition:background .12s;}
.party-row:hover{background:var(--accent-tint2);}
.party-row.active{background:var(--accent-tint);border-left:3px solid var(--accent);}
.party-row .pn{font-size:12.5px;font-weight:600;color:var(--ink);}
.party-row .pg{font-size:10px;color:var(--muted);margin-top:2px;}
.party-row .pb{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;margin-top:4px;}
.ledger-detail{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;}
.ledger-wrap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.ledger-toolbar{padding:10px 16px;border-bottom:1px solid var(--line-light);display:flex;align-items:center;gap:10px;flex:none;}
.ledger-toolbar .spacer{flex:1;}
.ledger-scroll{flex:1;overflow:auto;padding:0;}
.ledger-print-area{padding:22px 26px;}
.ledger-co-head{text-align:center;margin-bottom:14px;}
.ledger-co-head .co-name{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;}
.ledger-co-head .co-sub{font-size:11px;color:var(--muted);margin-top:2px;}
