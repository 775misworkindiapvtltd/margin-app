<script>
/* ==============================================================================
   RECEIVABLES DASHBOARD — UI / STATE / RENDER
   Uses the calculation engine defined in ReceivablesEngine.html (loaded first).
   ============================================================================== */

/* ---------------- Currency / date formatting ---------------- */
function fmtINR(num) {
  if (num === null || num === undefined || isNaN(num)) return '\u20B90';
  var isNeg = num < 0; num = Math.round(Math.abs(num));
  var str = String(num);
  var lastThree = str.substring(str.length - 3);
  var other = str.substring(0, str.length - 3);
  if (other !== '') lastThree = ',' + lastThree;
  var res = other.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + lastThree;
  return (isNeg ? '-' : '') + '\u20B9' + res;
}
function fmtINRShort(num) {
  if (!num) return '\u20B90';
  var abs = Math.abs(num);
  if (abs >= 10000000) return (num / 10000000).toFixed(1) + 'Cr';
  if (abs >= 100000) return (num / 100000).toFixed(1) + 'L';
  if (abs >= 1000) return (num / 1000).toFixed(1) + 'K';
  return fmtINR(num);
}
var MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDateDisp(d) { if (!d) return '--'; return d.getDate() + '-' + MONTH_NAMES[d.getMonth()] + '-' + d.getFullYear(); }
function fmtDateISO(d) { if (!d) return ''; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function initials(name) { name = String(name || '?').trim(); var parts = name.split(/\s+/); return ((parts[0] || '')[0] || '') .concat((parts[1] || '')[0] || '').toUpperCase() || name.slice(0, 2).toUpperCase(); }

/* ---------------- State ---------------- */
var RD = {};
RD.state = {
  ready: false, error: '', syncing: false,
  rawReceivables: null, rawReceipts: null, balanceAvailable: false, generatedAt: null,
  rows: [],          // deduped, cleaned receivable rows (all — not yet base-filtered)
  receipts: [],       // cleaned receipt rows
  receiptsByCustomer: new Map(),
  asOnDate: RD_startOfDay(new Date()),
  period: 'MTD',      // Today | 7D | 15D | 30D | MTD | QTD | YTD | Custom
  customFrom: null, customTo: null,
  compare: false,
  trendGranularity: 'monthly',
  filters: { company: 'All', branch: 'All', salesPerson: 'All', customerGroup: 'All', customer: 'All', search: '' },
  modal: null,        // { name, tab }
  followups: {},      // localStorage-backed { customerNameKey: [ {text, date} ] }
  toast: null,
  sidebarOpen: false,
  ageBucketFocus: null, // when set, Top Outstanding / detail view can filter by bucket
  charts: {}
};

function RD_startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function RD_addDays(d, n) { return new Date(d.getTime() + n * 86400000); }

try {
  var fu = localStorage.getItem('rd_followups');
  if (fu) RD.state.followups = JSON.parse(fu);
} catch (e) {}
function RD_saveFollowups() { try { localStorage.setItem('rd_followups', JSON.stringify(RD.state.followups)); } catch (e) {} }

/* ---------------- Financial-year-aware period math (India: 1 Apr - 31 Mar) ---------------- */
function RD_fyStart(d) { var y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; return new Date(y, 3, 1); }
function RD_quarterStart(d) {
  var m = d.getMonth(); // FY quarters: Apr-Jun, Jul-Sep, Oct-Dec, Jan-Mar
  var qStartMonth = m >= 3 ? (3 + Math.floor((m - 3) / 3) * 3) : (0 + Math.floor(m / 3) * 3);
  var y = d.getFullYear();
  return new Date(y, qStartMonth, 1);
}
function RD_monthStart(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }

function RD_periodRange() {
  var asOn = RD.state.asOnDate;
  switch (RD.state.period) {
    case 'Today': return [asOn, asOn];
    case '7D': return [RD_addDays(asOn, -6), asOn];
    case '15D': return [RD_addDays(asOn, -14), asOn];
    case '30D': return [RD_addDays(asOn, -29), asOn];
    case 'MTD': return [RD_monthStart(asOn), asOn];
    case 'QTD': return [RD_quarterStart(asOn), asOn];
    case 'YTD': return [RD_fyStart(asOn), asOn];
    case 'Custom': return [RD.state.customFrom || asOn, RD.state.customTo || asOn];
    default: return [RD_monthStart(asOn), asOn];
  }
}
function RD_previousPeriodRange() {
  var r = RD_periodRange();
  var days = Math.round((r[1].getTime() - r[0].getTime()) / 86400000) + 1;
  var prevTo = RD_addDays(r[0], -1);
  var prevFrom = RD_addDays(prevTo, -(days - 1));
  return [prevFrom, prevTo];
}

/* ---------------- Bootstrap / data loading ---------------- */
function RD_runServer(fnName, arg) {
  return new Promise(function (resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      reject(new Error('google.script.run not available — open this page via the Apps Script /exec URL.'));
      return;
    }
    var call = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) { reject(new Error(err.message || String(err))); });
    arg === undefined ? call[fnName]() : call[fnName](arg);
  });
}

function RD_loadAll() {
  RD.state.ready = false; RD.state.error = ''; RD_render();
  RD_runServer('getReceivablesBootstrap').then(function (data) {
    RD.state.rawReceivables = data.receivables;
    RD.state.rawReceipts = data.receipt;
    RD.state.balanceAvailable = !!data.balanceAvailable;
    RD.state.generatedAt = data.generatedAt ? new Date(data.generatedAt) : new Date();

    if (!data.receivables || !data.receivables.found || !data.receivables.headers.length) {
      RD.state.error = 'Could not find a Receivables sheet. A tab with headers like Party_Name, Pending Amount and Due_Date is required (any tab name works — headers are auto-detected).';
      RD.state.ready = true; RD_render(); return;
    }

    var built = buildRows(data.receivables.headers, data.receivables.rows);
    RD.state.rows = dedupe(built);

    if (data.receipt && data.receipt.found && data.receipt.headers.length) {
      RD.state.receipts = buildReceiptRows(data.receipt.headers, data.receipt.rows);
      RD.state.receiptsByCustomer = groupReceiptsByCustomer(RD.state.receipts);
    } else {
      RD.state.receipts = []; RD.state.receiptsByCustomer = new Map();
    }

    // Default As-On-Date = latest bill date present (falls back to server "today")
    RD.state.asOnDate = RD_startOfDay(new Date());
    RD.state.ready = true;
    RD_render();
  }).catch(function (err) {
    RD.state.error = err.message; RD.state.ready = true; RD_render();
  });
}

function RD_refresh() {
  RD.state.syncing = true; RD_render();
  RD_runServer('getReceivablesBootstrap').then(function (data) {
    RD.state.rawReceivables = data.receivables; RD.state.rawReceipts = data.receipt;
    RD.state.generatedAt = data.generatedAt ? new Date(data.generatedAt) : new Date();
    if (data.receivables && data.receivables.found) {
      RD.state.rows = dedupe(buildRows(data.receivables.headers, data.receivables.rows));
    }
    if (data.receipt && data.receipt.found) {
      RD.state.receipts = buildReceiptRows(data.receipt.headers, data.receipt.rows);
      RD.state.receiptsByCustomer = groupReceiptsByCustomer(RD.state.receipts);
    }
    RD.state.syncing = false; RD_toast('Synced with sheet.', false); RD_render();
  }).catch(function (err) { RD.state.syncing = false; RD_toast('Sync failed: ' + err.message, true); RD_render(); });
}

function RD_toast(msg, isErr) {
  RD.state.toast = { msg: msg, isErr: isErr };
  RD_render();
  setTimeout(function () { RD.state.toast = null; var t = document.querySelector('.rd-toast'); if (t) t.remove(); }, 3000);
}

/* ---------------- Derived / filtered data ---------------- */
function RD_uniqueValues(field) {
  var set = new Set();
  RD.state.rows.forEach(function (r) { if (r[field]) set.add(r[field]); });
  return Array.from(set).sort();
}

function RD_visibleRows() {
  var f = RD.state.filters;
  return RD.state.rows.filter(function (r) {
    if (f.salesPerson !== 'All') {
      var sp = r.salesPerson || 'Unassigned';
      if (sp !== f.salesPerson) return false;
    }
    if (f.customerGroup !== 'All' && r.subGroup !== f.customerGroup) return false;
    if (f.customer !== 'All' && normalizeName(r.partyName) !== normalizeName(f.customer)) return false;
    if (f.search) {
      var s = f.search.toLowerCase();
      var hay = (r.partyName + ' ' + r.billRefNo).toLowerCase();
      if (hay.indexOf(s) === -1) return false;
    }
    return true;
  });
}

function RD_computeAll() {
  var rows = RD_visibleRows();
  var asOn = RD.state.asOnDate;
  var kpis = computeKPIs(rows, asOn);
  var ageing = computeAgeing(rows, asOn);
  var topCustomers = computeTopCustomers(rows, asOn, 10);
  var customerList = computeCustomerList(rows, asOn);
  var mtdStart = RD_monthStart(asOn);
  var spGroups = computeSalesPersonGrouping(rows, asOn, RD.state.receiptsByCustomer, mtdStart);
  var upcoming = computeUpcomingCollections(rows, asOn);
  var forecast = computeCashForecast(rows, asOn);

  var pr = RD_periodRange();
  var receiptsInPeriod = RD.state.receipts.filter(function (r) { return r.receiptDate && r.receiptDate.getTime() >= pr[0].getTime() && r.receiptDate.getTime() <= pr[1].getTime(); });
  var collectedInPeriod = receiptsInPeriod.reduce(function (s, r) { return s + r.amount; }, 0);
  var collectedToday = RD.state.receipts.filter(function (r) { return r.receiptDate && sameDay(r.receiptDate, asOn); });
  var collectedTodayAmt = collectedToday.reduce(function (s, r) { return s + r.amount; }, 0);
  var custPaidToday = new Set(collectedToday.map(function (r) { return normalizeName(r.partyName); })).size;

  var trend = computeCollectionTrend(RD.state.receipts, RD.state.trendGranularity, pr[0], pr[1]);
  var prevRange = RD_previousPeriodRange();
  var prevReceipts = RD.state.receipts.filter(function (r) { return r.receiptDate && r.receiptDate.getTime() >= prevRange[0].getTime() && r.receiptDate.getTime() <= prevRange[1].getTime(); });
  var prevTrend = computeCollectionTrend(prevReceipts, RD.state.trendGranularity, prevRange[0], prevRange[1]);
  var prevCollected = prevReceipts.reduce(function (s, r) { return s + r.amount; }, 0);
  var collectionDeltaPct = prevCollected > 0 ? ((collectedInPeriod - prevCollected) / prevCollected * 100) : null;

  var efficiency = computeCollectionEfficiency(receiptsInPeriod, kpis.totalReceivable);

  var recentCollections = computeRecentCollections(RD.state.receipts, 8);

  // customers with no receipt in the last 60 days (only considered among those with outstanding)
  var sixtyAgo = RD_addDays(asOn, -60);
  var noReceipt60 = topCustomers.filter(function (c) {
    var key = normalizeName(c.name);
    var list = RD.state.receiptsByCustomer.get(key) || [];
    var recent = list.some(function (r) { return r.receiptDate && r.receiptDate.getTime() >= sixtyAgo.getTime(); });
    return !recent;
  }).map(function (c) { return c.name; });

  var insights = computeInsights(rows, asOn, kpis, ageing, topCustomers, collectionDeltaPct, noReceipt60, []);

  return {
    rows: rows, kpis: kpis, ageing: ageing, topCustomers: topCustomers, customerList: customerList,
    spGroups: spGroups, upcoming: upcoming, forecast: forecast, trend: trend, prevTrend: prevTrend,
    collectedInPeriod: collectedInPeriod, collectedTodayAmt: collectedTodayAmt, custPaidToday: custPaidToday,
    collectedTodayCount: collectedToday.length, efficiency: efficiency, collectionDeltaPct: collectionDeltaPct,
    recentCollections: recentCollections, insights: insights, periodRange: pr
  };
}

/* ---------------- Sidebar / topbar / filter bar ---------------- */
var NAV_GROUPS = [
  { label: 'Overview', items: [{ key: 'dashboard', label: 'Dashboard', icon: 'dashboard' }] },
  { label: 'Receivables', items: [
      { key: 'dashboard', label: 'Receivables Dashboard', icon: 'receivables' },
      { key: 'ageing', label: 'Ageing Summary', icon: 'ageing' },
      { key: 'customers', label: 'Customer List', icon: 'customer' },
      { key: 'upcoming', label: 'Upcoming Collections', icon: 'upcoming' },
      { key: 'overdue', label: 'Overdue Customers', icon: 'overdue' },
      { key: 'receipts', label: 'Receipt List', icon: 'receipts' },
      { key: 'salesperson', label: 'Collection by Sales Person', icon: 'users' }
  ]}
];

function RD_renderSidebar() {
  var groups = NAV_GROUPS.map(function (g) {
    var items = g.items.map(function (n) {
      return '<div class="rd-nav-item' + (RD.state.view === n.key ? ' active' : '') + '" data-rd-action="nav" data-rd-view="' + n.key + '">' + ICO[n.icon] + '<span>' + esc(n.label) + '</span></div>';
    }).join('');
    return '<div class="rd-nav-group"><div class="rd-nav-group-label">' + esc(g.label) + '</div>' + items + '</div>';
  }).join('');
  return '' +
    '<div class="rd-sidebar' + (RD.state.sidebarOpen ? ' open' : '') + '">' +
      '<div class="rd-brand"><div class="rd-brand-icon">' + ICO.dashboard + '</div><div class="rd-brand-text"><h1>Finance 360\u00B0</h1><div class="sub">Command Center</div></div></div>' +
      '<div class="rd-nav">' + groups + '</div>' +
      '<div class="rd-sidebar-foot"><button class="rd-sync-btn" data-rd-action="refresh">' + ICO.sync + (RD.state.syncing ? 'Refreshing\u2026' : 'Sync with Sheet') + '</button></div>' +
    '</div>';
}

function RD_periodBtns() {
  var opts = [['Today', 'Today'], ['7D', '7 Days'], ['15D', '15 Days'], ['30D', '30 Days'], ['MTD', 'MTD'], ['QTD', 'QTD'], ['YTD', 'YTD']];
  return opts.map(function (o) {
    return '<button class="rd-period-btn' + (RD.state.period === o[0] ? ' active' : '') + '" data-rd-action="period" data-rd-period="' + o[0] + '">' + o[1] + '</button>';
  }).join('') + '<button class="rd-period-btn' + (RD.state.period === 'Custom' ? ' active' : '') + '" data-rd-action="period" data-rd-period="Custom">Custom</button>';
}

function RD_selectOptions(current, list) {
  return ['All'].concat(list).map(function (v) { return '<option value="' + esc(v) + '"' + (v === current ? ' selected' : '') + '>' + esc(v === 'All' ? 'All' : v) + '</option>'; }).join('');
}

function RD_renderFilterBar() {
  var salesPeople = RD_uniqueValues('salesPerson').map(function (v) { return v; });

    '<div class="rd-filterbar">' +
      '<div class="rd-filter-field"><label>Company</label><select disabled title="Single-company data source"><option>All Companies</option></select></div>' +
      '<div class="rd-filter-field"><label>Branch</label><select disabled title="Single-branch data source"><option>All Branches</option></select></div>' +
      '<div class="rd-filter-field"><label>Sales Person</label><select data-rd-action="filter" data-rd-filter="salesPerson">' + RD_selectOptions(RD.state.filters.salesPerson, salesPeople) + '</select></div>' +
      '<div class="rd-filter-field"><label>Customer</label><select data-rd-action="filter" data-rd-filter="customer">' + RD_selectOptions(RD.state.filters.customer, customers) + '</select></div>' +
      '<div class="rd-filter-field"><label>Customer Group</label><select data-rd-action="filter" data-rd-filter="customerGroup">' + RD_selectOptions(RD.state.filters.customerGroup, groups) + '</select></div>' +

      '<div class="rd-period-group">' + RD_periodBtns() + '</div>' +

/* ---------------- Collection follow-up (due today, prioritized) ---------------- */
function RD_renderFollowupPanel(c) {
  var dueTodayRows = qualifiedRows(c.rows, RD.state.asOnDate).filter(function (r) { return r.dueDate && sameDay(r.dueDate, RD.state.asOnDate); });
  dueTodayRows.sort(function (a, b) { return b.pendingAmount - a.pendingAmount; });
  var n = dueTodayRows.length;
  var rows = dueTodayRows.slice(0, 8).map(function (r, i) {
    var tier = n <= 1 ? 'high' : (i < n / 3 ? 'high' : (i < (2 * n) / 3 ? 'medium' : 'low'));
    return '<tr data-rd-action="view-customer" data-rd-customer="' + esc(r.partyName) + '"><td>' + esc(r.partyName) + '</td><td class="num">' + fmtINR(r.pendingAmount) + '</td><td><span class="rd-status-pill ' + tier + '">' + tier.charAt(0).toUpperCase() + tier.slice(1) + '</span></td></tr>';
  }).join('');
  return '' +
    '<div class="rd-panel"><div class="rd-panel-head"><h3>Collection Follow-up (Due Today)</h3></div>' +
    '<div class="rd-panel-body" style="padding:0;"><div class="rd-table-scroll" style="max-height:230px;"><table class="rd-table"><thead><tr><th>Customer</th><th>Outstanding</th><th>Priority</th></tr></thead><tbody>' +
    (rows || '<tr class="rd-empty-row"><td colspan="3">Nothing due today.</td></tr>') + '</tbody></table></div></div></div>';
}

/* ============================================================================
   CUSTOMER DRILL-DOWN MODAL
   ============================================================================ */
var MODAL_TABS = [
  { key: 'open', label: 'Open Invoices' },
  { key: 'receipts', label: 'Receipt History' },
  { key: 'ageing', label: 'Ageing' },
  { key: 'ledger', label: 'Ledger' },
  { key: 'followups', label: 'Follow-ups' },
  { key: 'details', label: 'Customer Details' }
];

function RD_customerRows(name) {
  var key = normalizeName(name);
  return RD.state.rows.filter(function (r) { return normalizeName(r.partyName) === key; });
}

function RD_renderModal() {
  if (!RD.state.modal) return '';
  var name = RD.state.modal.name;
  var tab = RD.state.modal.tab || 'open';
  var asOn = RD.state.asOnDate;
  var custRowsAll = RD_customerRows(name);
  var custRows = qualifiedRows(custRowsAll, asOn);
  var totalOut = custRows.reduce(function (s, r) { return s + r.pendingAmount; }, 0);
  var overdueAmt = custRows.filter(function (r) { return computeOverdueDays(r, asOn) > 0; }).reduce(function (s, r) { return s + r.pendingAmount; }, 0);
  var notDueAmt = totalOut - overdueAmt;
  var maxOverdue = custRows.reduce(function (m, r) { return Math.max(m, computeOverdueDays(r, asOn)); }, 0);
  var custReceipts = (RD.state.receiptsByCustomer.get(normalizeName(name)) || []).slice().sort(function (a, b) { return (b.receiptDate ? b.receiptDate.getTime() : 0) - (a.receiptDate ? a.receiptDate.getTime() : 0); });
  var lastReceipt = custReceipts.length ? custReceipts[0].receiptDate : null;
  var nextDue = custRows.filter(function (r) { return r.dueDate && r.dueDate.getTime() >= asOn.getTime(); }).reduce(function (m, r) { return (!m || r.dueDate < m) ? r.dueDate : m; }, null);
  var phone = (custRows[0] && custRows[0].phone) || '';
  var salesPerson = (custRows[0] && custRows[0].salesPerson) || 'Unassigned';

  var tabsHtml = MODAL_TABS.map(function (t) {
    return '<div class="rd-modal-tab' + (tab === t.key ? ' active' : '') + '" data-rd-action="modal-tab" data-rd-tab="' + t.key + '">' + t.label + '</div>';
  }).join('');

  var body = '';
  if (tab === 'open') {
    var rows = custRows.map(function (r) {
      var od = computeOverdueDays(r, asOn);
      var bucket = ageingBucket(od, r.dueDate, asOn);
      var status = od > 90 ? 'Critical' : (od > 0 ? 'Overdue' : 'Not Due');
      var statusCls = od > 90 ? 'critical' : (od > 0 ? 'overdue' : 'current');
      return '<tr><td>' + esc(r.billRefNo || '\u2014') + '</td><td>' + fmtDateDisp(r.billDate) + '</td><td>' + fmtDateDisp(r.dueDate) + '</td><td class="num">' + fmtINR(r.pendingAmount) + '</td><td class="num">' + od + '</td><td>' + AGE_LABELS[bucket] + '</td><td><span class="rd-status-pill ' + statusCls + '">' + status + '</span></td></tr>';
    }).join('');
    body = '<table class="rd-table"><thead><tr><th>Invoice No.</th><th>Bill Date</th><th>Due Date</th><th>Pending</th><th>Overdue Days</th><th>Ageing Bucket</th><th>Status</th></tr></thead><tbody>' + (rows || '<tr class="rd-empty-row"><td colspan="7">No open invoices.</td></tr>') + '</tbody></table>';
  } else if (tab === 'receipts') {
    var rrows = custReceipts.map(function (r) {
      return '<tr><td>' + fmtDateDisp(r.receiptDate) + '</td><td>' + esc(r.receiptNo || '\u2014') + '</td><td class="num">' + fmtINR(r.amount) + '</td><td>' + esc(r.mode || '\u2014') + '</td><td>' + esc(r.reference || '\u2014') + '</td></tr>';
    }).join('');
    body = '<table class="rd-table"><thead><tr><th>Receipt Date</th><th>Receipt No.</th><th>Amount</th><th>Mode</th><th>Reference</th></tr></thead><tbody>' + (rrows || '<tr class="rd-empty-row"><td colspan="5">No receipts recorded for this customer.</td></tr>') + '</tbody></table>';
  } else if (tab === 'ageing') {
    var age = computeAgeing(custRowsAll, asOn);
    var arows = age.summary.filter(function (b) { return b.invoices > 0; }).map(function (b) {

function RD_loadLedgerIfNeeded() {
  if (!RD.state.modal || RD.state.modal.tab !== 'ledger' || !RD.state.balanceAvailable) return;
  var name = RD.state.modal.name;
  RD_runServer('getLedgerForCustomer', name).then(function (data) {
    var el = document.getElementById('rdLedgerBody');
    if (!el) return;
    if (!data.found || !data.rows.length) { el.innerHTML = '<div class="rd-panel-empty">No ledger entries found for this customer.</div>'; return; }
    var normed = data.headers.map(normHeader);
    function idx(aliases) { for (var i = 0; i < normed.length; i++) { for (var a = 0; a < aliases.length; a++) { if (normed[i].indexOf(aliases[a]) !== -1) return i; } } return -1; }
    var iDate = idx(['VOUCHER_DATE']), iPart = idx(['VOUCHER_PARTICULAR']), iType = idx(['VOUCHER_TYPE']), iNo = idx(['VOUCHER_NO']), iDeb = idx(['VOUCHER_DEBIT']), iCred = idx(['VOUCHER_CREDIT']), iOpen = idx(['OPENING_BALANCE']), iClose = idx(['CLOSING_BALANCE']);
    var rows = data.rows.map(function (r) {
      return '<tr><td>' + esc(r[iDate] || '') + '</td><td>' + esc(r[iPart] || '') + '</td><td>' + esc(r[iType] || '') + '</td><td>' + esc(r[iNo] || '') + '</td><td class="num">' + (iDeb > -1 ? fmtINR(parseCurrency(r[iDeb])) : '') + '</td><td class="num">' + (iCred > -1 ? fmtINR(parseCurrency(r[iCred])) : '') + '</td><td class="num">' + (iOpen > -1 ? fmtINR(parseCurrency(r[iOpen])) : '') + '</td><td class="num">' + (iClose > -1 ? fmtINR(parseCurrency(r[iClose])) : '') + '</td></tr>';
    }).join('');
    el.innerHTML = '<div class="rd-table-scroll" style="max-height:320px;"><table class="rd-table"><thead><tr><th>Date</th><th>Particular</th><th>Type</th><th>Voucher No.</th><th>Debit</th><th>Credit</th><th>Opening</th><th>Closing</th></tr></thead><tbody>' + (rows || '<tr class="rd-empty-row"><td colspan="8">No entries.</td></tr>') + '</tbody></table></div>';
  }).catch(function (err) {
    var el = document.getElementById('rdLedgerBody');
    if (el) el.innerHTML = '<div class="rd-panel-empty">Failed to load ledger: ' + esc(err.message) + '</div>';
  });
}

  var c = RD_computeAll();

    case 'upcoming': viewHtml = RD_renderUpcomingView(c); break;

    '<div class="rd-shell">' + RD_renderSidebar() +

    (RD.state.toast ? '<div class="rd-toast' + (RD.state.toast.isErr ? ' err' : '') + '">' + esc(RD.state.toast.msg) + '</div>' : '');

  RD_renderCharts(c);
  RD_loadLedgerIfNeeded();
  RD_bindGlobalDelegation();
}

/* ---------------- Chart.js rendering ---------------- */
function RD_destroyChart(id) { if (RD.state.charts[id]) { RD.state.charts[id].destroy(); delete RD.state.charts[id]; } }

function RD_renderCharts(c) {
  if (typeof Chart === 'undefined') return;

  RD_destroyChart('ageing');
  var ageCanvas = document.getElementById('rdChartAgeing');
  if (ageCanvas && c.ageing.total > 0) {
    var buckets = c.ageing.summary.filter(function (b) { return b.amount > 0; });
    RD.state.charts.ageing = new Chart(ageCanvas.getContext('2d'), {
      type: 'doughnut',
      data: { labels: buckets.map(function (b) { return AGE_LABELS[b.bucket]; }), datasets: [{ data: buckets.map(function (b) { return b.amount; }), backgroundColor: buckets.map(function (b) { return AGE_COLORS[b.bucket]; }), borderWidth: 0 }] },
      options: { cutout: '72%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (ctx) { return ctx.label + ': ' + fmtINR(ctx.parsed); } } } } }
    });
  }

  RD_destroyChart('efficiency');
  var effCanvas = document.getElementById('rdChartEfficiency');
  if (effCanvas) {
    var eff = Math.min(100, c.efficiency);
    var color = eff >= 90 ? '#16A34A' : (eff >= 72 ? '#F59E0B' : '#DC2626');
    RD.state.charts.efficiency = new Chart(effCanvas.getContext('2d'), {
      type: 'doughnut',
      data: { labels: ['Efficiency', 'Remaining'], datasets: [{ data: [eff, 100 - eff], backgroundColor: [color, '#EFF2F7'], borderWidth: 0 }] },
      options: { cutout: '76%', rotation: -90, circumference: 360, plugins: { legend: { display: false }, tooltip: { enabled: false } } }
    });
  }

  RD_destroyChart('trend');
  var trendCanvas = document.getElementById('rdChartTrend');
  if (trendCanvas && c.trend.length) {
    RD.state.charts.trend = new Chart(trendCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: c.trend.map(function (t) { return t.period; }),
        datasets: [{ label: 'Collections', data: c.trend.map(function (t) { return t.amount; }), backgroundColor: '#2563EB', borderRadius: 4, maxBarThickness: 28 }]
      },
      options: {
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (ctx) { return fmtINR(ctx.parsed.y); } } } },
        scales: { y: { ticks: { callback: function (v) { return fmtINRShort(v); } }, grid: { color: '#EFF2F7' } }, x: { grid: { display: false } } }
      }
    });
  }
}

/* ============================================================================
   EVENT HANDLING (delegated)
   ============================================================================ */
var RD_boundDelegation = false;
function RD_bindGlobalDelegation() {
  if (RD_boundDelegation) return;
  RD_boundDelegation = true;

  document.addEventListener('click', function (e) {
    var stopEl = e.target.closest('[data-rd-stop]');
    var overlayEl = e.target.closest('[data-rd-action="modal-close-overlay"]');
    if (overlayEl && !stopEl) { RD.state.modal = null; RD_render(); return; }

    var el = e.target.closest('[data-rd-action]');
    if (!el) return;
    var a = el.getAttribute('data-rd-action');

    if (a === 'nav') { RD.state.view = el.getAttribute('data-rd-view'); RD.state.sidebarOpen = false; RD_render(); return; }
    if (a === 'toggle-sidebar') { RD.state.sidebarOpen = !RD.state.sidebarOpen; RD_render(); return; }
    if (a === 'refresh') { RD_refresh(); return; }
    if (a === 'retry') { RD_loadAll(); return; }
    if (a === 'period') { RD.state.period = el.getAttribute('data-rd-period'); if (RD.state.period === 'Custom') { RD_openCustomDatePicker(); } RD_render(); return; }
    if (a === 'compare') { RD.state.compare = !RD.state.compare; RD_render(); return; }
    if (a === 'reset-filters') { RD.state.filters = { company: 'All', branch: 'All', salesPerson: 'All', customerGroup: 'All', customer: 'All', search: '' }; RD_render(); return; }
    if (a === 'view-customer') { RD.state.modal = { name: el.getAttribute('data-rd-customer'), tab: 'open' }; RD_render(); return; }
    if (a === 'view-customer-tab') { RD.state.modal = { name: el.getAttribute('data-rd-customer'), tab: el.getAttribute('data-rd-tab') }; RD_render(); return; }
    if (a === 'modal-close') { RD.state.modal = null; RD_render(); return; }
    if (a === 'modal-tab') { if (RD.state.modal) { RD.state.modal.tab = el.getAttribute('data-rd-tab'); RD_render(); } return; }
    if (a === 'filter-sp') { RD.state.filters.salesPerson = el.getAttribute('data-rd-sp'); RD_render(); return; }
    if (a === 'ageing-drill') { RD.state.view = 'customers'; RD.state.ageBucketFocus = el.getAttribute('data-rd-bucket'); RD_render(); return; }
    if (a === 'trend-gran') { RD.state.trendGranularity = el.getAttribute('data-rd-gran'); RD_render(); return; }
    if (a === 'add-followup') {
      var custName = el.getAttribute('data-rd-customer');
      var text = window.prompt('Add a follow-up note for ' + custName + ':');
      if (text) {
        var key = normalizeName(custName);
        if (!RD.state.followups[key]) RD.state.followups[key] = [];
        RD.state.followups[key].push({ text: text, date: fmtDateDisp(new Date()) + ' ' + new Date().toLocaleTimeString() });
        RD_saveFollowups();
        RD_render();
      }
      return;
    }
    if (a === 'ledger-print') { window.print(); return; }
    if (a === 'ledger-pdf') { RD_toast('Use your browser\u2019s Print dialog and choose "Save as PDF".', false); window.print(); return; }
    if (a === 'ledger-excel') { RD_exportLedgerCsv(); return; }
    if (a === 'ledger-whatsapp') { RD_ledgerWhatsapp(); return; }
    if (a === 'kpi-drill') {
      var kpi = el.getAttribute('data-rd-kpi');
      if (kpi === 'overdue') RD.state.view = 'overdue';
      else if (kpi === 'duetoday' || kpi === 'due7') RD.state.view = 'upcoming';
      else if (kpi === 'collected') RD.state.view = 'receipts';
      else RD.state.view = 'customers';
      RD_render();
      return;
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.getAttribute('data-rd-action') === 'filter') {
      var f = el.getAttribute('data-rd-filter');
      RD.state.filters[f] = el.value;
      RD_render();
    }
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.getAttribute('data-rd-action') === 'search') {
      RD.state.filters.search = el.value;
      clearTimeout(RD._searchTimer);
      RD._searchTimer = setTimeout(function () { RD_render(); }, 300);
    }
  });
}

function RD_openCustomDatePicker() {
  if (typeof flatpickr === 'undefined') return;
  setTimeout(function () {
    var el = document.getElementById('rdAsOnDate');
    if (!el) return;
    el.removeAttribute('readonly');
    flatpickr(el, {
      dateFormat: 'd-M-Y', defaultDate: RD.state.asOnDate,
      onChange: function (sel) { if (sel[0]) { RD.state.asOnDate = RD_startOfDay(sel[0]); RD_render(); } }
    });
  }, 30);
}

function RD_exportLedgerCsv() {
  var el = document.getElementById('rdLedgerBody');
  if (!el) return;
  var table = el.querySelector('table');
  if (!table) { RD_toast('No ledger data to export.', true); return; }
  var rows = Array.from(table.querySelectorAll('tr')).map(function (tr) {
    return Array.from(tr.querySelectorAll('th,td')).map(function (td) { return '"' + td.textContent.replace(/"/g, '""') + '"'; }).join(',');
  });
  var csv = rows.join('\n');
  var blob = new Blob([csv], { type: 'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = (RD.state.modal ? RD.state.modal.name : 'ledger') + '_statement.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function RD_ledgerWhatsapp() {
  if (!RD.state.modal) return;
  var name = RD.state.modal.name;
  var rows = RD_customerRows(name);
  var qrows = qualifiedRows(rows, RD.state.asOnDate);
  var total = qrows.reduce(function (s, r) { return s + r.pendingAmount; }, 0);
  var phone = (rows[0] && rows[0].phone) || '';
  var msg = 'Dear ' + name + ',\nYour current outstanding balance as on ' + fmtDateDisp(RD.state.asOnDate) + ' is ' + fmtINR(total) + ' across ' + qrows.length + ' invoice(s). Kindly arrange payment at the earliest.\n\nRegards.';
  var digits = phone.replace(/\D/g, '').split(',')[0];
  var url = 'https://wa.me/' + (digits ? '91' + digits.slice(-10) : '') + '?text=' + encodeURIComponent(msg);
  window.open(url, '_blank');
}

/* ---------------- Boot ---------------- */
RD_loadAll();
</script>
